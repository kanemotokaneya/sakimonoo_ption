<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPX 週次推移 — 取引参加者別建玉残高</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0b0d12;
  --panel: #161922;
  --panel-2: #1d2230;
  --border: #232733;
  --border-2: #2d3344;
  --text: #e9ecf1;
  --muted: #8b92a6;
  --dim: #5a6276;
  --accent: #818cf8;
  --pos-bg: rgba(34, 197, 94, 0.18);
  --pos-bg-strong: rgba(34, 197, 94, 0.55);
  --pos-text: #4ade80;
  --neg-bg: rgba(239, 68, 68, 0.18);
  --neg-bg-strong: rgba(239, 68, 68, 0.55);
  --neg-text: #f87171;
  --cat-macro:    #f59e0b;
  --cat-longterm: #3b82f6;
  --cat-cta:      #ec4899;
  --cat-arb:      #14b8a6;
  --cat-domins:   #10b981;
  --cat-domret:   #84cc16;
  --cat-other:    #6b7280;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  background: rgba(11, 13, 18, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--accent);
}
.meta {
  flex: 1;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.meta b { color: var(--text); font-weight: 600; }
.nav {
  display: flex;
  gap: 8px;
}
.nav a {
  color: var(--muted);
  font-size: 12px;
  text-decoration: none;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  white-space: nowrap;
}
.nav a:hover { color: var(--text); border-color: var(--accent); }
.tabs {
  display: flex;
  gap: 4px;
  padding: 12px 16px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  padding: 10px 16px;
  background: var(--panel);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 8px 8px 0 0;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.tab.active {
  background: var(--panel-2);
  color: var(--text);
  border-color: var(--accent);
  border-bottom-color: var(--panel-2);
}
.section-title {
  padding: 12px 16px 0;
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.section-title b { color: var(--text); font-weight: 600; letter-spacing: 0; text-transform: none; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; }
.scroll-wrap {
  margin: 8px 12px 24px;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  -webkit-overflow-scrolling: touch;
}
table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
}
thead th {
  position: sticky;
  top: 0;
  background: var(--panel-2);
  color: var(--muted);
  font-weight: 500;
  text-align: right;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-2);
  white-space: nowrap;
  font-size: 11px;
}
thead th:first-child, thead th:nth-child(2) { text-align: left; }
thead th .sub {
  display: block;
  font-size: 10px;
  color: var(--dim);
  font-weight: 400;
  margin-top: 2px;
}
tbody tr.cat-header td {
  background: var(--panel-2);
  color: var(--text);
  font-weight: 600;
  font-size: 11px;
  padding: 6px 10px;
  border-top: 1px solid var(--border-2);
  border-bottom: 1px solid var(--border-2);
  letter-spacing: 0.04em;
}
tbody tr.cat-header td .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
tbody td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  font-family: 'DM Mono', ui-monospace, monospace;
  font-size: 12px;
  white-space: nowrap;
}
tbody td.broker {
  text-align: left;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  white-space: nowrap;
  position: sticky;
  left: 0;
  background: var(--panel);
  z-index: 1;
  border-right: 1px solid var(--border);
}
tbody tr:hover td.broker { background: var(--panel-2); }
tbody td.cat {
  text-align: left;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--muted);
  font-size: 11px;
  position: sticky;
  left: 130px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  z-index: 1;
}
tbody td.oi {
  font-weight: 600;
  background: var(--panel-2);
  border-left: 1px solid var(--border-2);
}
tbody td.dim { color: var(--dim); }
tbody td.zero { color: var(--dim); }
.cell-pos { background: var(--pos-bg); color: var(--pos-text); }
.cell-pos-strong { background: var(--pos-bg-strong); color: #fff; font-weight: 600; }
.cell-neg { background: var(--neg-bg); color: var(--neg-text); }
.cell-neg-strong { background: var(--neg-bg-strong); color: #fff; font-weight: 600; }
.dot-macro    { background: var(--cat-macro); }
.dot-longterm { background: var(--cat-longterm); }
.dot-cta      { background: var(--cat-cta); }
.dot-arb      { background: var(--cat-arb); }
.dot-domins   { background: var(--cat-domins); }
.dot-domret   { background: var(--cat-domret); }
.dot-other    { background: var(--cat-other); }
.empty-state {
  margin: 32px 16px;
  padding: 32px 20px;
  background: var(--panel);
  border: 1px dashed var(--border-2);
  border-radius: 10px;
  text-align: center;
  color: var(--muted);
}
.empty-state h2 {
  font-family: 'Outfit', sans-serif;
  color: var(--text);
  margin: 0 0 8px;
  font-size: 18px;
}
.empty-state .hint {
  margin-top: 16px;
  font-size: 11px;
  color: var(--dim);
}
.banner-info {
  margin: 12px 16px 0;
  padding: 10px 14px;
  background: rgba(129, 140, 248, 0.08);
  border: 1px solid rgba(129, 140, 248, 0.25);
  border-radius: 8px;
  color: var(--accent);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  padding: 8px 16px 0;
  font-size: 10px;
  color: var(--muted);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-item .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
@media (max-width: 600px) {
  tbody td.cat { display: none; }
  tbody td.broker { left: 0; }
  thead th.cat { display: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📊 週次推移</div>
  <div class="meta" id="meta"></div>
  <div class="nav">
    <a href="index.html">← ダッシュボード</a>
    <a href="pnl_simulator.html">P&L</a>
    <a href="archive.html">アーカイブ</a>
  </div>
</div>

<div id="legend" class="legend"></div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="n225_large" type="button">日経225先物</button>
  <button class="tab" data-tab="n225_mini" type="button">日経225mini</button>
  <button class="tab" data-tab="topix" type="button">TOPIX先物</button>
</div>

<div id="banner"></div>
<div id="content"></div>

<script>
(function(){
  'use strict';

  var CAT_DOTS = {
    'グローバルマクロ': 'macro',
    '長期投資志向': 'longterm',
    'トレンドフォロー（CTA）': 'cta',
    'アービトラージ（裁定取引）': 'arb',
    '国内機関投資家': 'domins',
    '国内個人投資家（ネットトレーダー）': 'domret',
    '-': 'other'
  };
  var CAT_LABELS = {
    'グローバルマクロ': 'グローバルマクロ',
    '長期投資志向': '長期投資志向',
    'トレンドフォロー（CTA）': 'トレンドフォロー（CTA）',
    'アービトラージ（裁定取引）': 'アービトラージ（裁定取引）',
    '国内機関投資家': '国内機関投資家',
    '国内個人投資家（ネットトレーダー）': '国内個人投資家',
    '-': 'ー（分類外）'
  };
  var CAT_ORDER = [
    'グローバルマクロ',
    '長期投資志向',
    'トレンドフォロー（CTA）',
    'アービトラージ（裁定取引）',
    '国内機関投資家',
    '国内個人投資家（ネットトレーダー）',
    '-'
  ];
  var SECTION_LABELS = {
    'n225_large': '日経225先物',
    'n225_mini':  '日経225mini',
    'topix':      'TOPIX先物'
  };

  var state = {
    data: null,
    activeTab: 'n225_large',
    maxAbsWow: 1
  };

  // --- helpers ---
  function fmt(n, opts) {
    opts = opts || {};
    if (n === null || n === undefined) return '';
    if (n === 0) return '0';
    var abs = Math.abs(n);
    var sign = n < 0 ? '-' : (opts.signed ? '+' : '');
    var s;
    if (abs >= 10000) s = (abs / 10000).toFixed(abs >= 100000 ? 0 : 1) + '万';
    else s = abs.toLocaleString('ja-JP', { maximumFractionDigits: 0 });
    return sign + s;
  }
  function fmtDate(yyyymmdd) {
    if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd || '';
    return yyyymmdd.substring(4, 6) + '/' + yyyymmdd.substring(6, 8);
  }
  function cellClass(v, maxAbs) {
    if (v === null || v === undefined || v === 0) return 'zero';
    var ratio = Math.min(1, Math.abs(v) / Math.max(maxAbs, 1));
    var strong = ratio >= 0.5;
    if (v > 0) return strong ? 'cell-pos-strong' : 'cell-pos';
    return strong ? 'cell-neg-strong' : 'cell-neg';
  }

  // --- rendering ---
  function renderMeta() {
    var d = state.data;
    var meta = document.getElementById('meta');
    if (!d || d.error) {
      meta.innerHTML = '<span>データ未取得</span>';
      return;
    }
    var weeks = d.weeks || [];
    var lim = (d.limgetsu || {})[state.activeTab] || '';
    var generated = d.generated_at ? fmtDate(d.generated_at) : '';
    var html = '';
    html += '<span><b>限月</b> ' + lim + '</span>';
    if (generated) html += '<span><b>最終データ</b> ' + generated + '</span>';
    html += '<span><b>週数</b> ' + weeks.length + '</span>';
    meta.innerHTML = html;
  }

  function renderLegend() {
    var legend = document.getElementById('legend');
    var html = '';
    var keys = Object.keys(CAT_DOTS);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      html += '<span class="legend-item">';
      html += '<span class="dot dot-' + CAT_DOTS[k] + '"></span>';
      html += '<span>' + CAT_LABELS[k] + '</span>';
      html += '</span>';
    }
    legend.innerHTML = html;
  }

  function renderBanner() {
    var d = state.data;
    var b = document.getElementById('banner');
    if (!d) { b.innerHTML = ''; return; }
    if (d.error) {
      b.innerHTML = '<div class="banner-info">⚠️ ' + d.error + '</div>';
      return;
    }
    var wks = d.weeks || [];
    if (wks.length < 5) {
      b.innerHTML = '<div class="banner-info">📦 データ蓄積中: ' + wks.length + '/5週分。フル表示は週次ファイル蓄積後</div>';
    } else {
      b.innerHTML = '';
    }
  }

  function renderTable() {
    var d = state.data;
    var content = document.getElementById('content');
    if (!d || d.error || !d.sections) {
      content.innerHTML = '<div class="empty-state">' +
        '<h2>データなし</h2>' +
        '<p>data/weekly_trend.json が見つからない、または週次ファイルが未配置です。</p>' +
        '<p class="hint">scripts/extract_weekly_trend.py を pipeline 後に実行してください</p>' +
        '</div>';
      return;
    }

    var rows = d.sections[state.activeTab] || [];
    var weeks = d.weeks || [];
    var lim = (d.limgetsu || {})[state.activeTab] || '';

    // Compute max abs WoW for color scaling (this section only, exclude None)
    var maxAbs = 1;
    for (var i = 0; i < rows.length; i++) {
      var w = rows[i].wow || [];
      for (var j = 0; j < w.length; j++) {
        if (w[j] !== null && Math.abs(w[j]) > maxAbs) maxAbs = Math.abs(w[j]);
      }
    }
    state.maxAbsWow = maxAbs;

    // Group rows by category
    var byCat = {};
    for (var k = 0; k < rows.length; k++) {
      var c = rows[k].category || '-';
      if (!byCat[c]) byCat[c] = [];
      byCat[c].push(rows[k]);
    }

    // Build table HTML
    var h = '';
    h += '<div class="section-title"><b>' + SECTION_LABELS[state.activeTab] + '</b> · ' + lim + ' · 前週比増減（週次推移）取引参加者別 · 売り越しはマイナス表示</div>';
    h += '<div class="scroll-wrap"><table>';

    // Header
    h += '<thead><tr>';
    h += '<th>証券会社</th>';
    h += '<th class="cat">主な顧客の特徴</th>';
    // WoW columns (skip the first week which has wow=null)
    for (var w = 0; w < weeks.length; w++) {
      var label = fmtDate(weeks[w]);
      var sub = w === 0 ? '基準' : '前週比';
      h += '<th>' + label + '<span class="sub">' + sub + '</span></th>';
    }
    // Current OI column
    if (weeks.length > 0) {
      h += '<th>' + fmtDate(weeks[weeks.length - 1]) + '<span class="sub">建玉残高</span></th>';
    }
    h += '</tr></thead>';

    // Body
    h += '<tbody>';
    for (var ci = 0; ci < CAT_ORDER.length; ci++) {
      var cat = CAT_ORDER[ci];
      var catRows = byCat[cat];
      if (!catRows || catRows.length === 0) continue;
      var dotClass = CAT_DOTS[cat] || 'other';
      var colspan = 3 + weeks.length; // broker + cat + weeks + oi
      h += '<tr class="cat-header"><td colspan="' + colspan + '"><span class="dot dot-' + dotClass + '"></span>' + CAT_LABELS[cat] + ' (' + catRows.length + ')</td></tr>';
      for (var ri = 0; ri < catRows.length; ri++) {
        var row = catRows[ri];
        h += '<tr>';
        h += '<td class="broker">' + row.broker + '</td>';
        h += '<td class="cat">' + (CAT_LABELS[cat] || '') + '</td>';
        var wow = row.wow || [];
        for (var wi = 0; wi < wow.length; wi++) {
          var v = wow[wi];
          if (v === null || v === undefined) {
            h += '<td class="dim">—</td>';
          } else {
            h += '<td class="' + cellClass(v, maxAbs) + '">' + fmt(v, {signed: true}) + '</td>';
          }
        }
        h += '<td class="oi">' + fmt(row.oi_current) + '</td>';
        h += '</tr>';
      }
    }
    h += '</tbody></table></div>';

    content.innerHTML = h;
  }

  function setTab(tab) {
    state.activeTab = tab;
    var btns = document.querySelectorAll('.tab');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-tab') === tab) btns[i].classList.add('active');
      else btns[i].classList.remove('active');
    }
    renderMeta();
    renderTable();
  }

  // --- init ---
  function init() {
    renderLegend();

    // Event delegation for tabs
    document.getElementById('tabs').addEventListener('click', function(ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains('tab')) {
        var tab = t.getAttribute('data-tab');
        if (tab) setTab(tab);
      }
    });

    fetch('data/weekly_trend.json', { cache: 'no-store' })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(j) {
        state.data = j;
        renderMeta();
        renderBanner();
        renderTable();
      })
      .catch(function(err) {
        state.data = { error: 'data/weekly_trend.json の読み込みに失敗: ' + err.message };
        renderMeta();
        renderBanner();
        renderTable();
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
